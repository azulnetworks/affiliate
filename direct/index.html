<script>
(function () {
    var DEST = 'https://playpayish.com/green/';

    function eid() {
        return 'ob_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    }

    function isInAppBrowser() {
        var ua = (navigator.userAgent || '').toLowerCase();
        var p = ['tiktok','bytedance','musical_ly','aweme','instagram','fbav','fb_iab','fban','fbios','fbss',
                 'snapchat','linkedinapp','twitter','pinterest','line/','micromessenger','kakaotalk'];
        for (var i = 0; i < p.length; i++) { if (ua.indexOf(p[i]) !== -1) return true; }
        return false;
    }

    function getOS() {
        var ua = (navigator.userAgent || '').toLowerCase();
        if (/iphone|ipad|ipod/.test(ua)) return 'ios';
        if (/android/.test(ua)) return 'android';
        return 'other';
    }

    function breakout(url) {
        var os = getOS();
        if (os === 'android') {
            var clean = url.replace(/^https?:\/\//, '');
            var intent = 'intent://' + clean +
                '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
                encodeURIComponent(url) + ';end';
            try { (window.top || window).location.href = intent; }
            catch (e) { window.location.href = intent; }
            setTimeout(function () { window.location.href = url; }, 800);
        } else if (os === 'ios') {
            var safari = url.replace(/^https:\/\//, 'x-safari-https://');
            try { (window.top || window).location.href = safari; }
            catch (e) { window.location.href = safari; }
            setTimeout(function () { window.location.href = url; }, 800);
        } else {
            window.location.href = url;
        }
    }

    var dest = DEST;
    var force = /[?&]force=1/.test(window.location.search);
    if (!isInAppBrowser() && !force) {
        window.location.replace(dest);
        return;
    }

    var btn = document.getElementById('ctaBtn');
    var tracked = false;
    var navigated = false;

    function fireClickButton() {
        if (tracked) return;
        tracked = true;
        try {
            if (window.ttq && window.ttq.track) {
                var id = eid();
                ttq.track('ClickButton', {
                    content_id: 'open_browser_cta',
                    content_type: 'product',
                    content_name: 'open_in_browser'
                }, { event_id: id });
                ttq.track('CompleteRegistration', {
                    content_id: 'open_browser_cta',
                    content_type: 'product',
                    content_name: 'open_in_browser'
                }, { event_id: id + '_cr' });
            }
        } catch (e) {}
    }

    function go() {
        if (navigated) return;
        navigated = true;
        breakout(dest);
    }

    btn.addEventListener('pointerdown', fireClickButton, { passive: true });
    btn.addEventListener('touchstart', fireClickButton, { passive: true });

    btn.addEventListener('click', function (e) {
        e.preventDefault();
        fireClickButton();
        setTimeout(go, 250);
    });
})();
</script>
</body>
</html>
