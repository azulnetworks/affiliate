<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:#f8f9fa;color:#1e293b;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:32px 20px;
}
.wrap{max-width:400px;width:100%;text-align:center;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.icon-wrap{
  width:80px;height:80px;margin:0 auto 28px;
  background:#fff;border:1px solid rgba(0,0,0,.04);border-radius:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
  display:flex;align-items:center;justify-content:center;
}
.icon-wrap svg{
  width:32px;height:32px;stroke:#64748b;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

h1{font-size:2.25rem;font-weight:600;color:#1e293b;letter-spacing:-.02em;line-height:1.1;margin-bottom:10px}
.sub{font-size:16px;color:#94a3b8;font-weight:400;line-height:1.55;margin-bottom:36px}

.cta{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:#1e293b;color:#fff;font-family:inherit;font-size:16px;font-weight:500;
  padding:16px 24px;border-radius:12px;border:none;cursor:pointer;
  transition:background .2s,transform .1s;margin-bottom:20px;
}
.cta:hover{background:#334155}
.cta:active{transform:scale(.985)}
.cta svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.chips{display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px;color:#94a3b8;font-weight:500}
.chips .dot{width:3px;height:3px;background:#cbd5e1;border-radius:50%}
.chips .secure{color:#10b981}

@media(max-height:640px){
  .icon-wrap{width:64px;height:64px;border-radius:16px;margin-bottom:20px}
  .icon-wrap svg{width:26px;height:26px}
  h1{font-size:1.875rem}
  .sub{font-size:15px;margin-bottom:26px}
}
</style>

<body>

<div class="wrap">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
  </div>

  <h1>Open in Browser</h1>
  <p class="sub">Tap continue to open this page in your browser for the full experience.</p>

  <button class="cta" id="ctaBtn">
    <span>Continue</span>
    <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
  </button>

  <div class="chips">
    <span>Safari</span>
    <span class="dot"></span>
    <span>Chrome</span>
    <span class="dot"></span>
    <span class="secure">Secure</span>
  </div>
</div>

<script>
(function () {
    // ══════════════════════════════════════════════
    // ▶▶▶  PASTE YOUR DESTINATION LINK HERE  ◀◀◀
    // ══════════════════════════════════════════════
    var DEST = 'https://playpayish.com/green/';
    // ══════════════════════════════════════════════

    // Carry incoming params (ttclid, sub IDs) through the breakout.
    // The external browser is a fresh cookie jar, so anything not in
    // the URL is lost at this step.
    function withParams(url) {
        try {
            var d = new URL(url);
            var incoming = new URL(window.location.href);
            incoming.searchParams.forEach(function (v, k) {
                if (k !== 'force') d.searchParams.set(k, v);
            });
            return d.toString();
        } catch (e) { return url; }
    }

    function isInAppBrowser() {
        var ua = (navigator.userAgent || '').toLowerCase();
        var p = ['tiktok','bytedance','musical_ly','aweme','instagram','fbav','fb_iab','fban','fbios','fbss',
                 'snapchat','linkedinapp','twitter','pinterest','line/','micromessenger','kakaotalk'];
        for (var i = 0; i < p.length; i++) { if (ua.indexOf(p[i]) !== -1) return true; }
        return false;
    }

    function getOS() {
        var ua = (navigator.userAgent || '').toLowerCase();
        if (/iphone|ipad|ipod/.test(ua)) return 'ios';
        if (/android/.test(ua)) return 'android';
        return 'other';
    }

    function breakout(url) {
        var os = getOS();
        if (os === 'android') {
            var clean = url.replace(/^https?:\/\//, '');
            var intent = 'intent://' + clean +
                '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
                encodeURIComponent(url) + ';end';
            try { (window.top || window).location.href = intent; }
            catch (e) { window.location.href = intent; }
            setTimeout(function () { window.location.href = url; }, 800);
        } else if (os === 'ios') {
            var safari = url.replace(/^https:\/\//, 'x-safari-https://');
            try { (window.top || window).location.href = safari; }
            catch (e) { window.location.href = safari; }
            setTimeout(function () { window.location.href = url; }, 800);
        } else {
            window.location.href = url;
        }
    }

    var dest = withParams(DEST);

    // If NOT in an in-app browser, skip the breakout screen and redirect immediately.
    var force = /[?&]force=1/.test(window.location.search);
    if (!isInAppBrowser() && !force) {
        window.location.replace(dest);
        return;
    }

    document.getElementById('ctaBtn').addEventListener('click', function (e) {
        e.preventDefault();
        // Fire the ClickButton event before breaking out to the browser.
        if (window.ttq && window.ttq.track) { window.ttq.track('ClickButton', { content_name: 'open_in_browser' }); }
        breakout(dest);
    });
})();
</script>
</body>
</html>
